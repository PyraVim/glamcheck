name: glamcheck
description: Find code that breaks under Ethereum's Glamsterdam gas repricing (EIP-8037, EIP-8038, EIP-2780), and run your Foundry suite under Amsterdam rules.
author: PyraVim
branding:
  icon: alert-triangle
  color: orange

inputs:
  path:
    description: Directory to scan, relative to the workspace.
    default: "."
  foundry-diff:
    description: Run the Foundry suite under today's rules and under Amsterdam rules and report tests that flip. "auto" runs it when foundry.toml exists in `path`.
    default: "auto"
  forge-args:
    description: Extra arguments for forge test (for example "--match-path test/unit/*").
    default: ""
  fail-on:
    description: 'When to fail the job: "flips" (a test passes today and fails under Amsterdam), "hits" (any static hit, or a flip), or "none".'
    default: "flips"
  sarif-file:
    description: Write static hits as SARIF to this path (upload it with github/codeql-action/upload-sarif). Empty to skip.
    default: ""
  foundry-version:
    description: Foundry version for the diff. Needs 1.8.5 or later for --hardfork amsterdam.
    default: "v1.8.5"
  semgrep-version:
    description: semgrep version (pip).
    default: "1.177.0"

outputs:
  hits:
    description: Number of static hits.
    value: ${{ steps.run.outputs.hits }}
  flips:
    description: Number of tests that pass today and fail under Amsterdam.
    value: ${{ steps.run.outputs.flips }}
  results-file:
    description: Path of the JSON results file.
    value: ${{ steps.run.outputs.results-file }}

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "22"

    - name: Install glamcheck (no install scripts)
      shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH"

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"

    - name: Install semgrep
      shell: bash
      env:
        SEMGREP_VERSION: ${{ inputs.semgrep-version }}
      run: python -m pip install --quiet --disable-pip-version-check "semgrep==${SEMGREP_VERSION}"

    - name: Decide whether to run the Foundry diff
      id: plan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        FOUNDRY_DIFF: ${{ inputs.foundry-diff }}
      run: |
        run=false
        if [[ "$FOUNDRY_DIFF" == "true" ]] || { [[ "$FOUNDRY_DIFF" == "auto" ]] && [[ -f "$SCAN_PATH/foundry.toml" ]]; }; then run=true; fi
        echo "diff=$run" >> "$GITHUB_OUTPUT"

    - name: Install Foundry
      if: steps.plan.outputs.diff == 'true'
      uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      with:
        version: ${{ inputs.foundry-version }}

    - name: Run glamcheck
      id: run
      shell: bash
      env:
        GLAMCHECK_PATH: ${{ inputs.path }}
        GLAMCHECK_DIFF: ${{ steps.plan.outputs.diff }}
        GLAMCHECK_FORGE_ARGS: ${{ inputs.forge-args }}
        GLAMCHECK_FAIL_ON: ${{ inputs.fail-on }}
        GLAMCHECK_SARIF: ${{ inputs.sarif-file }}
        GLAMCHECK_OUT: ${{ runner.temp }}/glamcheck-out
        SEMGREP_ENABLE_VERSION_CHECK: "0"
        FOUNDRY_FFI: "false"
      run: node --import "$GITHUB_ACTION_PATH/node_modules/tsx/dist/esm/index.mjs" "$GITHUB_ACTION_PATH/src/action/run.ts"
